# Rocket Game 42 under https://babuni.dev/Rocketgame42/ and https://www.babuni.dev/Rocketgame42/
#
# Installed by install-on-server.sh as /etc/nginx/snippets/rocketgame42-locations.conf
# and included in the existing HTTPS babuni.dev server block, before its
# catch-all `location /` — the same way as the Button Game snippet.
# The game server listens on 127.0.0.1:8788 only (rocketgame42.service).

location = /Rocketgame42  { return 301 /Rocketgame42/$is_args$args; }
location = /rocketgame42  { return 301 /Rocketgame42/$is_args$args; }
location = /rocketgame42/ { return 301 /Rocketgame42/$is_args$args; }
location = /RocketGame42  { return 301 /Rocketgame42/$is_args$args; }
location = /RocketGame42/ { return 301 /Rocketgame42/$is_args$args; }

location ^~ /Rocketgame42/ {
    proxy_pass http://127.0.0.1:8788;   # no URI part: the /Rocketgame42/ prefix is kept
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The website's server block already adds these to every response.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;    # server block sends no-cache
    gzip on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    client_max_body_size 4k;
}
